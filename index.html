<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas con Progreso</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <h1>Lista de Tareas</h1>

    <section class="contador" aria-live="polite">
      <p>Total de tareas: <strong id="total">0</strong></p>
      <p>Completadas: <strong id="completadas">0</strong></p>
      <p>Pendientes: <strong id="pendientes">0</strong></p>
      <div class="barra" aria-hidden="true">
        <div class="barra-progreso" id="barra-progreso"></div>
      </div>
    </section>

    <form id="form-tarea" class="formulario" autocomplete="off">
      <input type="text" id="input-tarea" placeholder="Escribe una tarea..." aria-label="Nueva tarea">
      <button type="submit" class="btn btn-agregar">Agregar tarea</button>
    </form>
    <p id="mensaje-error" class="error" role="alert"></p>

    <ul id="lista-tareas" class="lista"></ul>
    <p id="vacio" class="vacio">No hay tareas todavía.</p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
